id: fitness-record-analysis
version: '1.0.0'
name: 训练量与可比较记录分析
reviewed_on: '2026-10-09'
origin: GrowthPilot 自有实现；公开方法摘要
sources:
  - id: acsm-2026
    title: ACSM 2026 抗阻训练指南说明
    url: https://acsm.org/resistance-training-guidelines-update-2026/
    role: 专业方法依据
    summary: 训练应结合个人目标；规律参与、训练量与负荷均需结合个人情况理解。
  - id: fitbod-algorithm
    title: Fitbod 官方算法说明
    url: https://fitbod.me/blog/fitbod-algorithm/
    role: 竞品能力参考；未接入其算法
    summary: 竞品将目标、器械、训练记录和本人反馈用于下一次安排。
procedure:
  - 先执行训练量计算工具，核对组数、总次数、外部重量量与原记录版本。
  - 使用可比较记录工具；仅同名动作、相同组数和次数、不同日期、正外部重量的单一条目参与重量比较。
  - 同名不保证器械、动作幅度或努力程度相同，因此比较只描述记录数值，不能证明力量提升。
  - 按实际记录回顾节奏；没有记录的日期保持未知，安排与未执行记录不进入训练量。
  - 目标、经验、器械、努力程度、恢复与身体限制未结构化采集前，不给个体加重或训练处方。
limits:
  - 外部重量量按填写重量 × 组数 × 每组次数计算；不是肌肉有效训练量、能量消耗或力量评分。
  - 零外部重量、自重或未填明细不按零训练刺激解释。
  - 不汇总不同动作重量量为身体表现；不推断肌群，不预测恢复，不估算 1RM。
  - 不根据总体分钟判断 WHO 活动达标；当前缺少强度分类与适用人群信息。
